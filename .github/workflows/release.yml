name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and read the release notes
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          foreach ($file in "engine/r1999engine/__init__.py", "ui/r1999ui/__init__.py") {
            $found = (Select-String -Path $file -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
            if ($found -ne $version) { throw "$file is at $found but the tag is $env:TAG" }
          }
          .github/scripts/release-notes.ps1 -Version $version | Set-Content -Encoding utf8 release-notes.md
          "VERSION=$version" >> $env:GITHUB_ENV
          "PRERELEASE=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test the engine
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\test_engine.py

      - name: Test the UI
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\test_ui.py

      - name: Download the Kanit font
        shell: pwsh
        run: |
          $commit = "130fcfb0ff422fec96b335616b2ca99f91914792"
          $fonts = @{
            "Kanit-Light.ttf"    = "7c04b0be6011782fcc4c032f4033ef6f6ba1fef99b135ba1ee68b800c53017ec"
            "Kanit-Regular.ttf"  = "27170c049660b2f962d3ed28441fd20f4c743503ca031fec9c2b4542d6c52736"
            "Kanit-Medium.ttf"   = "50a237034244026a7c63fe55e24e0b4298babe363cde043e032075b764c545a2"
            "Kanit-SemiBold.ttf" = "67e64baf1a7e6e076435518ff0e6bf25c4d74b98143cd1a2688db906c0abce11"
            "OFL.txt"            = "eb998cc5a685b240cdb46a0b5747e70334c8c57bbd7b1f6b044d75719358df67"
          }
          $dest = "ui/r1999ui/fonts"
          New-Item -ItemType Directory -Force $dest | Out-Null
          foreach ($name in $fonts.Keys) {
            $file = Join-Path $dest $name
            Invoke-WebRequest "https://raw.githubusercontent.com/google/fonts/$commit/ofl/kanit/$name" -OutFile $file
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $fonts[$name]) { throw "$name has the SHA-256 $hash, expected $($fonts[$name])" }
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build the app and the installer
        shell: pwsh
        run: ./build.ps1

      - name: Write checksums
        shell: pwsh
        run: |
          $setup = Get-Item "dist/R1999Translator-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            "release", "create", $env:TAG,
            "dist/R1999Translator-Setup-$env:VERSION.exe", "dist/SHA256SUMS.txt",
            "--title", "R1999 Translator $env:VERSION",
            "--notes-file", "release-notes.md",
            "--verify-tag"
          )
          if ($env:PRERELEASE -eq "true") { $ghArgs += "--prerelease" }
          gh @ghArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
