name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and read the release notes
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          foreach ($file in "engine/r1999engine/__init__.py", "ui/r1999ui/__init__.py") {
            $found = (Select-String -Path $file -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
            if ($found -ne $version) { throw "$file is at $found but the tag is $env:TAG" }
          }
          .github/scripts/release-notes.ps1 -Version $version | Set-Content -Encoding utf8 release-notes.md
          "VERSION=$version" >> $env:GITHUB_ENV
          "PRERELEASE=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test the engine
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\test_engine.py

      - name: Test the UI
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests\test_ui.py

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build the app and the installer
        shell: pwsh
        run: ./build.ps1

      - name: Write checksums
        shell: pwsh
        run: |
          $setup = Get-Item "dist/R1999Translator-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            "release", "create", $env:TAG,
            "dist/R1999Translator-Setup-$env:VERSION.exe", "dist/SHA256SUMS.txt",
            "--title", "R1999 Translator $env:VERSION",
            "--notes-file", "release-notes.md",
            "--verify-tag"
          )
          if ($env:PRERELEASE -eq "true") { $ghArgs += "--prerelease" }
          gh @ghArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
